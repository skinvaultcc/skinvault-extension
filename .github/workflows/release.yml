# Builds both zips for a release tag and publishes them as the tag's GitHub
# release. The asset names carry no version, so
# releases/latest/download/<name> always points at the latest one.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test

      - name: Build the zips
        run: |
          pnpm run zip
          pnpm run zip:firefox
          cp .output/*-chrome.zip skinvault-extension-chrome.zip
          cp .output/*-firefox.zip skinvault-extension-firefox.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          skinvault-extension-chrome.zip skinvault-extension-firefox.zip
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
